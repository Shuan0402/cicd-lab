name: CI Pipeline

on:
  push:
    branches: [ "main", "mfeature/ci-observe" ]
  pull_request:
    branches: [ "main", "feature/ci-observe" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      # TypeScript typecheck
      - name: Run TypeScript Typecheck
        run: npm run typecheck

      # Prettier check
      - name: Run Prettier Check
        run: npm run format:check

      # Test
      - name: Create Test Results Directory
        run: mkdir -p test-results
        
      - name: Run Tests
        run: npm run test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      # 將測試結果顯示於 GitHub actions 結果頁面
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-results/**/*.xml"